<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20304e"/>
      <stop offset=".52" stop-color="#4f6ea8"/>
      <stop offset="1" stop-color="#f0b98a"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa4c4"/><stop offset="1" stop-color="#b9c8dc"/>
