    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0cc" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff0cc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rr"><rect width="512" height="512" rx="115"/></clipPath>
  </defs>

  <g clip-path="url(#rr)">
